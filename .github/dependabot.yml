version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Chicago
    open-pull-requests-limit: 5
    groups:
      astro-tooling:
        patterns:
          - astro
          - "@astrojs/*"
      quality-tooling:
        patterns:
          - prettier
          - prettier-plugin-astro
          - axe-core
          - svgo
          - typescript

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:15"
      timezone: America/Chicago
    open-pull-requests-limit: 5
