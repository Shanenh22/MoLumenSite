name: Toolkit visual repair check

on:
  push:
    branches:
      - audit-finalization-2026-08-10
    paths:
      - '.github/workflows/toolkit-visual-check.yml'

permissions:
  contents: read

jobs:
  verify-toolkit:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: |
          npm ci
          npm run audit:install
          npx playwright install --with-deps chromium
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils

      - name: Apply visual audit repairs
        run: python scripts/fix-toolkit-layout.py

      - name: Build and regenerate toolkit
        run: |
          npm run build
          npm run toolkit:pdf
          npm run verify:core
          npm run verify:interactive

      - name: Run strict site audits
        shell: bash
        run: |
          set -o pipefail
          mkdir -p /tmp/toolkit-visual/pdf-pages
          npm run audit | tee /tmp/toolkit-visual/site-audit.txt
          npm run audit:a11y | tee /tmp/toolkit-visual/accessibility.txt
          npm run check:contrast | tee /tmp/toolkit-visual/contrast.txt
          npm run check:hero-contrast | tee /tmp/toolkit-visual/hero-contrast.txt

      - name: Verify RSS and render PDF pages
        run: |
          grep -q '<title>Mo Lumen Astrology, Articles</title>' dist/rss.xml
          grep -q 'title="Mo Lumen Astrology: Articles"' dist/index.html
          if grep -q '/current-sky/' dist/rss.xml; then
            echo 'Article-only RSS still contains a Current Sky URL.'
            exit 1
          fi
          cp public/downloads/birth-time-toolkit.pdf /tmp/toolkit-visual/
          pdftoppm -png -r 120 public/downloads/birth-time-toolkit.pdf /tmp/toolkit-visual/pdf-pages/page

      - name: Upload visual artifact
        uses: actions/upload-artifact@v4
        with:
          name: molumen-strict-final-audit
          path: /tmp/toolkit-visual
          if-no-files-found: error
          retention-days: 7
