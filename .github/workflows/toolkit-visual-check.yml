name: Finalize verified MoLumen audit

on:
  push:
    branches:
      - audit-finalization-2026-08-10
    paths:
      - '.github/workflows/toolkit-visual-check.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: |
          npm ci
          npm run audit:install
          npx playwright install --with-deps chromium
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils

      - name: Apply verified visual audit repairs
        run: python scripts/fix-toolkit-layout.py

      - name: Build and verify release candidate
        run: |
          npm run build
          npm run toolkit:pdf
          npm run verify:core
          npm run verify:interactive

      - name: Run strict release audits
        shell: bash
        run: |
          set -o pipefail
          mkdir -p /tmp/molumen-release/pdf-pages
          npm run audit | tee /tmp/molumen-release/site-audit.txt
          npm run audit:a11y | tee /tmp/molumen-release/accessibility.txt
          npm run check:contrast | tee /tmp/molumen-release/contrast.txt
          npm run check:hero-contrast | tee /tmp/molumen-release/hero-contrast.txt
          grep -q '<title>Mo Lumen Astrology, Articles</title>' dist/rss.xml
          grep -q 'title="Mo Lumen Astrology: Articles"' dist/index.html
          if grep -q '/current-sky/' dist/rss.xml; then
            echo 'Article-only RSS still contains a Current Sky URL.'
            exit 1
          fi
          cp public/downloads/birth-time-toolkit.pdf /tmp/molumen-release/
          pdftoppm -png -r 120 public/downloads/birth-time-toolkit.pdf /tmp/molumen-release/pdf-pages/page

      - name: Upload final release evidence
        uses: actions/upload-artifact@v4
        with:
          name: molumen-release-candidate
          path: /tmp/molumen-release
          if-no-files-found: error
          retention-days: 7

      - name: Remove temporary audit machinery and commit
        shell: bash
        run: |
          git rm -r --ignore-unmatch audit-artifacts
          git rm .github/workflows/toolkit-visual-check.yml scripts/fix-toolkit-layout.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A

          echo 'Release-candidate diff:'
          git diff --cached --name-status
          if git ls-files audit-artifacts scripts/fix-toolkit-layout.py .github/workflows/toolkit-visual-check.yml | grep -q .; then
            echo 'Temporary audit paths remain tracked in the release tree.'
            exit 1
          fi

          git commit -m "Complete final site audit and toolkit repair"
          git push
