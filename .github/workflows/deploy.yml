name: Build and deploy to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Confirm deploy credentials are present
        env:
          API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          missing=""
          [ -z "$API_TOKEN" ] && missing="$missing CLOUDFLARE_API_TOKEN"
          [ -z "$ACCOUNT_ID" ] && missing="$missing CLOUDFLARE_ACCOUNT_ID"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secret(s):$missing"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run check

      - name: Content integrity
        run: npm run test:content

      - name: Build
        run: npm run build

      - name: Verify the build produced something sane
        run: |
          test -f dist/index.html || { echo "::error::dist/index.html missing"; exit 1; }
          test -f dist/llms.txt   || { echo "::error::dist/llms.txt missing"; exit 1; }
          test -f dist/_headers   || { echo "::error::dist/_headers missing"; exit 1; }
          pages=$(find dist -name '*.html' | wc -l)
          echo "Built $pages HTML pages."
          if [ "$pages" -lt 100 ]; then
            echo "::error::Only $pages pages built; refusing partial deploy."
            exit 1
          fi

      - name: Deploy to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4.114.0 --version
          npx --yes wrangler@4.114.0 deploy

      - name: Confirm the deploy is live
        run: |
          sleep 10
          code=$(curl -s -o /dev/null -w '%{http_code}' https://molumen.shanenh.workers.dev/llms.txt)
          echo "GET /llms.txt → $code"
          [ "$code" = "200" ] || echo "::warning::llms.txt returned $code — check deploy manually."
