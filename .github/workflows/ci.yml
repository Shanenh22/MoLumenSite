name: Pull request validation

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Formatting (advisory)
        continue-on-error: true
        run: npm run format:check
      - name: Agent instruction integrity
        run: npm run check:agent-docs
      - name: Publishing contracts
        run: npm run check:publishing-contracts
      - name: Astro/type checks
        run: npm run check
      - name: Content integrity
        run: npm run test:content
      - name: Build
        run: npm run build
      - name: Internal links
        run: npm run test:links
      - name: Search relevance
        run: npm run test:search
      - name: Booking-link source of truth
        run: npm run check:booking-links
      - name: Install browser test tools
        run: |
          npm run audit:install
          npx playwright install --with-deps chromium
      - name: Capture logo preview screenshots
        run: |
          mkdir -p pr-preview
          python3 -m http.server 4321 --directory dist >/tmp/pr-preview-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID' EXIT
          sleep 2
          node --input-type=module <<'EOF'
          import { chromium } from 'playwright';

          const browser = await chromium.launch({ headless: true });

          const desktop = await browser.newPage({ viewport: { width: 1440, height: 900 } });
          await desktop.goto('http://127.0.0.1:4321/', { waitUntil: 'networkidle' });
          await desktop.screenshot({ path: 'pr-preview/desktop-home.png' });
          await desktop.locator('.site-footer').scrollIntoViewIfNeeded();
          await desktop.locator('.site-footer').screenshot({ path: 'pr-preview/desktop-footer.png' });

          const mobile = await browser.newPage({ viewport: { width: 390, height: 844 }, isMobile: true });
          await mobile.goto('http://127.0.0.1:4321/', { waitUntil: 'networkidle' });
          await mobile.screenshot({ path: 'pr-preview/mobile-home.png' });
          await mobile.locator('[data-open-mobile-nav]').click();
          await mobile.waitForTimeout(250);
          await mobile.screenshot({ path: 'pr-preview/mobile-menu.png' });

          await browser.close();
          EOF
      - name: Upload logo preview screenshots
        uses: actions/upload-artifact@v4
        with:
          name: logo-preview-screenshots
          path: pr-preview/*.png
          if-no-files-found: error
      - name: Booking handoff
        run: npm run test:booking
      - name: Reading Finder handoff
        run: npm run test:finder
      - name: Analytics privacy
        run: npm run test:analytics
      # The calendar check forces two browser time zones 24 hours apart and
      # asserts an identical grid. CI runs in UTC, where a getDate()/getUTCDate()
      # mix-up is invisible — which is exactly why this has to run here.
      - name: Current Sky calendar
        run: npm run test:calendar
      - name: Birth Time Confidence
        run: npm run test:birthtime
      - name: Rising sign preference
        run: npm run test:rising
      - name: Chart explorer mobile and desktop
        run: npm run test:chart-explorer
      - name: Search mobile and desktop
        run: npm run test:search-browser
      - name: Navigation breakpoints and behavior
        run: npm run test:navigation
      - name: Accessibility sweep, mobile and desktop
        run: npm run audit:a11y
      - name: Static contrast
        run: npm run check:contrast
      - name: Hero-image contrast
        run: npm run check:hero-contrast
